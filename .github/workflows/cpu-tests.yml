name: CPU tests

on:
  push:
  pull_request:

jobs:
  reference-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.7.1
          python -m pip install pytest triton==3.3.1

      - name: Run CPU reference and validation tests
        run: python -m pytest -m "not cuda" -q
